<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình thiết bị YOLO UNO</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #818cf8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .form-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit.loading {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #msg.success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        #msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        #msg.info {
            display: block;
            background: rgba(129, 140, 248, 0.1);
            color: var(--input-focus);
            border: 1px solid rgba(129, 140, 248, 0.2);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>YOLO UNO</h1>
            <p>Cấu hình kết nối mạng & máy chủ</p>
        </div>
        
        <form id="ConfigForm">
            <div class="form-group">
                <input name="ssid" id="ssid" type="text" placeholder="Tên Wi-Fi (SSID)" required>
            </div>
            
            <div class="form-group">
                <input name="password" id="pass" type="password" placeholder="Mật khẩu (bỏ trống nếu không có)">
            </div>
            
            <div class="form-group">
                <input name="token" id="token" type="text" placeholder="Token Core IoT" required>
            </div>
            
            <div class="form-group">
                <input name="server" id="server" type="text" placeholder="Máy chủ (VD: app.coreiot.io)" required>
            </div>
            
            <div class="form-group">
                <input name="port" id="port" type="text" placeholder="Cổng (VD: 1883)" required>
            </div>
            
            <button type="submit" id="submitBtn" class="btn-submit">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Kết Nối Thiết Bị</span>
            </button>
            <button type="button" id="toggleLedBtn" class="btn-submit" style="background: var(--success); margin-top: 15px;">
                LED 
            </button>
            
            <div style="margin-top: 20px;">
                <label for="neoColor" style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 8px; display: block;">Chọn màu Neo Pixel:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="neoColor" style="flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); color: white; padding: 12px; border-radius: 12px; outline: none; font-weight: bold;">
                        <option value="#ff0000" style="color: #fca5a5;">Đỏ (Red)</option>
                        <option value="#00ff00" style="color: #86efac;">Xanh lá (Green)</option>
                        <option value="#0000ff" style="color: #93c5fd;">Xanh dương (Blue)</option>
                        <option value="#ffff00" style="color: #fde047;">Vàng (Yellow)</option>
                        <option value="#800080" style="color: #d8b4fe;">Tím (Purple)</option>
                    </select>
                </div>
            </div>
            <button type="button" id="toggleNeoBtn" class="btn-submit" style="background: #8b5cf6; margin-top: 10px;">
                Bật/Tắt Neo Pixel
            </button>
        </form>
        
        <div id="msg"></div>
        
        <div class="footer">
            Bảo mật & an toàn thông tin
        </div>
    </div>

    <script>
        document.getElementById('ConfigForm').onsubmit = function (e) {
            e.preventDefault();
            
            const ssid = document.getElementById('ssid').value;
            const pass = document.getElementById('pass').value;
            const token = document.getElementById('token').value;
            const server = document.getElementById('server').value;
            const port = document.getElementById('port').value;
            
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            const msgBox = document.getElementById('msg');
            
            // Cập nhật trạng thái nút
            btn.classList.add('loading');
            spinner.style.display = 'block';
            btnText.innerText = 'Đang xử lý...';
            btn.disabled = true;
            
            msgBox.className = 'info';
            msgBox.innerText = "Đang gửi thông tin cấu hình...";

            const url = `/connect?ssid=${encodeURIComponent(ssid)}&pass=${encodeURIComponent(pass)}&token=${encodeURIComponent(token)}&server=${encodeURIComponent(server)}&port=${encodeURIComponent(port)}`;

            fetch(url)
                .then(r => r.text())
                .then(msg => {
                    // Khôi phục nút
                    btn.classList.remove('loading');
                    spinner.style.display = 'none';
                    btnText.innerText = 'Kết Nối Thiết Bị';
                    btn.disabled = false;
                    
                    if (msg.includes("Thành công")) {
                        msgBox.className = 'success';
                        msgBox.innerText = "✅ " + msg;
                    } else {
                        msgBox.className = 'error';
                        msgBox.innerText = "❌ " + msg;
                    }
                })
                .catch(err => {
                    btn.classList.remove('loading');
                    spinner.style.display = 'none';
                    btnText.innerText = 'Kết Nối Thiết Bị';
                    btn.disabled = false;
                    
                    msgBox.className = 'error';
                    msgBox.innerText = "⚠️ Lỗi kết nối tới thiết bị!";
                });
        };

        document.getElementById('toggleLedBtn').onclick = function() {
            const btn = this;
            btn.innerText = 'Đang đổi trạng thái...';
            fetch('/toggle-led')
                .then(r => r.text())
                .then(msg => {
                    btn.innerText = `LED : ${msg}`;
                    const msgBox = document.getElementById('msg');
                    msgBox.style.display = 'block';
                    msgBox.className = msg === 'ON' ? 'success' : 'info';
                    msgBox.innerText = `💡 LED đã ${msg === 'ON' ? 'BẬT' : 'TẮT'}`;
                })
                .catch(err => {
                    btn.innerText = 'LED';
                    const msgBox = document.getElementById('msg');
                    msgBox.style.display = 'block';
                    msgBox.className = 'error';
                    msgBox.innerText = "⚠️ Lỗi khi đổi trạng thái đèn!";
                });
        };

        document.getElementById('toggleNeoBtn').onclick = function() {
            const btn = this;
            const color = document.getElementById('neoColor').value;
            btn.innerText = 'Đang đổi Neopixel...';
            // pass color in API call
            fetch(`/toggle-neo?color=${encodeURIComponent(color)}`)
                .then(r => r.text())
                .then(msg => {
                    btn.innerText = `Neo Pixel: ${msg}`;
                    const msgBox = document.getElementById('msg');
                    msgBox.style.display = 'block';
                    msgBox.className = msg === 'ON' ? 'success' : 'info';
                    msgBox.innerText = `💡 Neo Pixel (Màu ${color}) đã ${msg === 'ON' ? 'BẬT' : 'TẮT'}`;
                })
                .catch(err => {
                    btn.innerText = 'Neo Pixel';
                    const msgBox = document.getElementById('msg');
                    msgBox.style.display = 'block';
                    msgBox.className = 'error';
                    msgBox.innerText = "⚠️ Lỗi khi đổi trạng thái Neo Pixel!";
                });
        };
    </script>
</body>
</html>
